# Автоматическая проверка при каждой отправке изменений в репозиторий.
# На чистой машине выполняются шаги из README: установка библиотек, автоматические
# тесты, запуск приложения командой «python main.py» и проверка основных сценариев
# работы (вход под тремя ролями, прогноз, выгрузка документов).
name: Тесты и проверка установки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    env:
      # Сборка PyTorch для процессора: графический ускоритель системе не нужен
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      # Русский текст в выводе программ, перенаправленном в файл (важно для Windows)
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Автоматические тесты
        run: python -m pytest tests -q --junitxml=pytest.xml

      # Число пройденных, пропущенных и упавших тестов — в аннотацию и сводку запуска
      - name: Итог тестов
        if: always()
        shell: bash
        run: |
          python - <<'EOF'
          import os, platform, xml.etree.ElementTree as ET
          suite = ET.parse("pytest.xml").getroot().find("testsuite")
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          failed = int(suite.get("failures")) + int(suite.get("errors"))
          line = (f"Python {platform.python_version()}, {platform.system()}: пройдено {total - skipped - failed}, "
                  f"пропущено {skipped}, упало {failed}, время {float(suite.get('time')):.0f} с")
          print(f"::notice title=pytest::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"**Автоматические тесты.** {line}\n\n")
          EOF

      - name: Запуск приложения и проверка сценариев
        shell: bash
        run: |
          python main.py > server.log 2>&1 &
          server=$!
          status=0
          python check_install.py --wait 120 --report protocol.md || status=$?
          kill "$server" || true
          if [ -f protocol.md ]; then echo "::notice title=check_install::$(tail -n 1 protocol.md)"; fi
          exit "$status"

      - name: Протокол проверки в сводке запуска
        if: always()
        shell: bash
        run: |
          if [ -f protocol.md ]; then cat protocol.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-${{ matrix.os }}-python${{ matrix.python }}
          path: |
            protocol.md
            server.log
          if-no-files-found: ignore
